<!-- 在 login.html 同目录 -->
<div class="container mt-5">
  <h3>忘记密码</h3>
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <input type="email" name="email" class="form-control" placeholder="输入注册邮箱" required>
    </div>
    <button type="submit" class="btn btn-primary">发送重置链接</button>
    <a href="{{ url_for('main.login') }}" class="btn btn-link">返回登录</a>
  </form>
</div>
