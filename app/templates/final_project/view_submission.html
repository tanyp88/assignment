<!-- templates/final_project/view_submission.html -->
{% if submission.grade is not none %}
<div class="alert alert-success">
    <h5>AI 评分：{{ submission.grade }}/100</h5>
    <p><strong>提交 ID：</strong> #{{ submission.id }}</p>
    <!-- 期末项目：#1000001，作业：#123 -->
    <p><strong>反馈：</strong></p>
    <pre class="bg-light p-3 rounded">{{ submission.feedback }}</pre>
</div>
{% else %}
<button class="btn btn-success btn-lg" onclick="gradeNow({{ submission.id }})">
    使用 AI 批改此项目
</button>
<div id="grading-status" class="mt-3"></div>
{% endif %}

<script>
function gradeNow(submission_id) {
    const status = document.getElementById('grading-status');
    status.innerHTML = '<div class="alert alert-info">批改任务已提交，请稍后刷新页面...</div>';
    
    fetch("{{ url_for('final_project.api_grade_project_submission') }}", {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': window.getCsrfToken()
        },
        body: JSON.stringify({ submission_id })
    })
    .then(r => r.json())
    .then(data => {
        if (data.success) {
            status.innerHTML = `<div class="alert alert-success">${data.message}</div>`;
            setTimeout(() => location.reload(), 2000);
        } else {
            status.innerHTML = `<div class="alert alert-danger">错误: ${data.error}</div>`;
        }
    });
}
</script>
