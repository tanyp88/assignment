{# memo_edit.html#}
{% extends "base.html" %}
{% block title %}Edit Memo - {{ class_.name }}{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>
        <i class="fas fa-sticky-note text-warning"></i> 
        备忘录 - {{ class_.name }}
    </h2>

    <div class="card mt-3">
        <div class="card-header bg-light">
            <strong>历史备忘</strong>
        </div>
        <div class="card-body bg-light">
            {% if class_.memo %}
                <pre class="mb-0 text-muted" style="white-space: pre-wrap; font-family: inherit;">{{ class_.memo }}</pre>
            {% else %}
                <p class="text-muted mb-0">暂无备忘记录</p>
            {% endif %}
        </div>
    </div>

    <div class="card mt-3">
        <div class="card-header">
            <strong>添加新备忘</strong>
        </div>
        <div class="card-body">
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label">新内容（将追加到历史）</label>
                    <textarea 
                        name="new_memo" 
                        class="form-control" 
                        rows="5" 
                        placeholder="输入新的备忘内容..." 
                        required></textarea>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-plus"></i> 添加到备忘录
                    </button>
                    <a href="{{ url_for('main.student_dashboard') }}" class="btn btn-secondary">
                        <i class="fas fa-arrow-left"></i> 返回
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
