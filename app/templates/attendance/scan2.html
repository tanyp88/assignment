{% extends "base.html" %}
{% block title %}Scan to Check In{% endblock %}
{% block content %}
<div class="container text-center mt-5">
    <h3>Check In: {{ class_name }}</h3>

    <!-- Scanner Container -->
    <div id="scanner-container" 
         style="width:450px;height:450px;margin:20px auto;border:2px dashed #007bff;border-radius:12px;overflow:hidden;position:relative;">
        <div id="overlay" class="position-absolute top-50 start-50 translate-middle text-white fw-bold" 
             style="font-size:1.5rem;pointer-events:none;display:none;background:rgba(0,0,0,0.6);padding:12px 20px;border-radius:12px;z-index:10;">
            Scanning...
        </div>
    </div>

    <button id="start-scan" class="btn btn-primary btn-lg px-5">
        <i class="fas fa-camera"></i> Start Camera
    </button>
    <p id="status" class="mt-3"></p>
</div>

<!-- html5-qrcode (HTTPS compatible) -->
<script src="https://unpkg.com/html5-qrcode@2.3.7/minified/html5-qrcode.min.js"></script>
<script>
    const classId = {{ class_id | tojson }};
    const checkinStatusUrl = `/zuoye/attendance/checkin_status/${classId}`;
    let alreadyCheckedIn = false;
    let scanner = null;

    // --- CHECK IF ALREADY CHECKED IN ---
    async function checkExistingCheckin() {
        try {
            const resp = await fetch(checkinStatusUrl);
            const data = await resp.json();
            if (data.checked_in) {
                alreadyCheckedIn = true;
                document.getElementById('status').innerHTML = `
                    <div class="alert alert-info">
                        <i class="fas fa-check-circle"></i>
                        <strong>You have already checked in today.</strong>
                    </div>`;
                document.getElementById('start-scan').disabled = true;
                document.getElementById('start-scan').innerHTML = '<i class="fas fa-check"></i> Already Checked In';
            }
        } catch (e) {
            console.error("Status check failed:", e);
        }
    }

    // --- START SCANNER: BACK CAMERA ONLY ---
// --- START SCANNER: BACK CAMERA ONLY (NO HANG) ---
async function startScanner() {
    const statusEl = document.getElementById('status');
    const btn = document.getElementById('start-scan');
    const overlay = document.getElementById('overlay');
    
    btn.disabled = true;
    statusEl.innerHTML = `<small class="text-muted">Requesting camera access...</small>`;

    try {
        // --- OPTION 1: TRY TO LIST CAMERAS (TRIGGERS PERMISSION) ---
        let cameras = [];
        try {
            cameras = await Promise.race([
                Html5Qrcode.getCameras(),
                new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), 5000))
            ]);
        } catch (e) {
            console.warn("getCameras failed or timed out:", e);
            // Continue without list
        }

        scanner = new Html5Qrcode("scanner-container");

        const config = {
            fps: 10,
            qrbox: { width: 350, height: 350 },
            aspectRatio: 1,
            focusMode: "continuous"
        };

        overlay.style.display = 'block';
        statusEl.innerHTML = `<small class="text-primary">Point at QR code...</small>`;

        // --- OPTION 2: FORCE BACK CAMERA VIA facingMode ---
        await scanner.start(
            { facingMode: "environment" },  // ← BACK CAMERA ONLY
            config,
            async (decodedText) => {
                overlay.style.display = 'none';
                await scanner.stop();
                const token = extractToken(decodedText);
                if (token) {
                    requestLocationAndCheckin(token);
                } else {
                    showError("Invalid QR code. Try again.");
                }
            },
            () => {}
        );

        // --- HIDE SWITCH + TAP TO FOCUS ---
        setTimeout(() => {
            const switchBtn = document.querySelector('.html5-qrcode-camera-switch');
            if (switchBtn) switchBtn.style.display = 'none';
        }, 1000);

        document.getElementById('scanner-container').addEventListener('click', () => {
            const video = document.querySelector('#scanner-container video');
            if (video) video.focus();
        });

    } catch (err) {
        console.error("Scanner error:", err);
        showError("Camera failed. Please allow access and try again.");
        btn.disabled = false;
    }
}
    // --- REST OF CODE (extractToken, requestLocationAndCheckin, checkin, showError) ---
    // ... [SAME AS BEFORE] ...

    // --- BUTTON ---
    document.getElementById('start-scan').onclick = () => {
        if (alreadyCheckedIn) return;
        startScanner();
    };

    document.addEventListener('DOMContentLoaded', () => {
        checkExistingCheckin();
    });

    document.getElementById('start-scan').onclick = () => {
    console.log("Start button clicked");  // ← ADD THIS
    if (alreadyCheckedIn) return;
    startScanner();
};
</script>
{% endblock %}
