{# templates/attendance/wechat_checkin.html #}
{% extends "base.html" %}
{% block title %}正在签到...{% endblock %}
{% block content %}
<div class="container text-center mt-5">
    <h4>正在获取位置并签到...</h4>
    <div class="spinner-border text-primary" role="status"></div>
    <p id="status" class="mt-3">请求定位权限...</p>
</div>

<script>
const token = "{{ token }}";
const status = document.getElementById('status');

function submitCheckin(lat, lng) {
    fetch('/zuoye/attendance/checkin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, latitude: lat, longitude: lng })
    })
    .then(r => r.json())
    .then(data => {
        if (data.success) {
            status.innerHTML = `<strong style="color:green">${data.message}</strong>`;
            setTimeout(() => window.location = '{{ url_for("main.student_dashboard") }}', 1500);
        } else {
            status.innerHTML = `<strong style="color:red">${data.message}</strong>`;
        }
    })
    .catch(() => {
        status.innerHTML = `<strong style="color:red">网络错误</strong>`;
    });
}

// TRY GPS
if ("geolocation" in navigator) {
    status.textContent = "正在获取位置...";
    navigator.geolocation.getCurrentPosition(
        pos => submitCheckin(pos.coords.latitude, pos.coords.longitude),
        () => {
            status.innerHTML = `<strong style="color:orange">定位失败，尝试无位置签到...</strong>`;
            submitCheckin(null, null);  // Fallback
        },
        { timeout: 8000, enableHighAccuracy: true }
    );
} else {
    submitCheckin(null, null);
}
</script>
{% endblock %}
