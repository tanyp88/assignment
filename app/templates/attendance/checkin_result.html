{% extends "base.html" %}

{% block title %}签到结果{% endblock %}

{% block content %}

<div class="container mt-5">
<div class="row justify-content-center">
<div class="col-md-6">
<div class="card shadow-lg p-4 text-center">
{% if status == 'success' %}
<div class="text-success mb-3">
<i class="fas fa-check-circle fa-5x"></i>
</div>
<h2 class="text-success mb-3">签到成功！</h2>
<p class="lead">欢迎回来，{{ user.nickname }}。</p>
{% else %}
<div class="text-danger mb-3">
<i class="fas fa-times-circle fa-5x"></i>
</div>
<h2 class="text-danger mb-3">签到失败</h2>
{% endif %}

            <p class="text-muted">{{ message }}</p>
            
            <a href="#" onclick="window.close();" class="btn btn-primary mt-4">关闭此页面</a>
        </div>
    </div>
</div>


</div>
{% endblock %}
