<div class="container mt-5">
  <h3>设置新密码</h3>
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <input type="password" name="password" class="form-control" placeholder="新密码（至少8位）" required>
    </div>
    <div class="mb-3">
      <input type="password" name="confirm" class="form-control" placeholder="再次输入" required>
    </div>
    <button type="submit" class="btn btn-success">确认修改</button>
  </form>
</div>
